name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - run: flutter create . --platforms=android
      - run: sed -i 's/compileSdk = 33/compileSdk = 34/g' android/app/build.gradle.kts || true
      - run: sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' android/app/build.gradle || true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
