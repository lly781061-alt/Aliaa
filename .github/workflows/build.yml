name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Clean, Recreate, Set MinSDK and Add Dependencies
        run: |
          rm -rf android
          flutter create . --org com.example --project-name store_app --platforms android
          flutter pub add firebase_core
          flutter pub add cloud_firestore
          
          # تحديث minSdkVersion إلى 21 تلقائياً لتتوافق مع فايربيز
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$BUILD_GRADLE"
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' "$BUILD_GRADLE"
          fi
          
          flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
