name: Build APK Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Android & Fix Package Match
        run: |
          mkdir -p ../app_build
          cp -a . ../app_build/
          cd ../app_build
          
          # توحيد اسم الحزمة بدقة لتجنب الانهيار
          sed -i 's/^name:.*/name: store_app/g' pubspec.yaml
          
          flutter create . --platforms=android --org com.example
          
          # ضبط الـ SDK وضمان مطابقة الـ namespace
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/namespace .*/namespace "com.example.store_app"/g' android/app/build.gradle || true
          fi
          
          cd -
          cp -a ../app_build/android ./

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
