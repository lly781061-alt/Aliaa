name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: false

      - name: Recreate Android Project & Setup Firebase
        run: |
          rm -rf android
          flutter create . --org com.example --project-name store_app --platforms=android
          
          # تأكد من إنشاء مجلد app/src وانخفاض الـ minSdkVersion
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' $BUILD_GRADLE
            sed -i 's/minSdkVersion 19/minSdkVersion 21/g' $BUILD_GRADLE
          fi

          # دمج ملف جوجل سيرفيسز تلقائياً إذا كان محفوظاً في المستودع أو إعادة إنشائه
          mkdir -p android/app
          
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
