name: Build APK Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Android Platform & Fix Properties
        run: |
          mkdir -p ../app_build
          cp -a . ../app_build/
          cd ../app_build
          
          # تصحيح اسم الحزمة مؤقتًا
          sed -i 's/^name:.*/name: store_app/g' pubspec.yaml
          
          # توليد منصة أندرويد
          flutter create . --platforms=android --org com.store.app
          
          # إضافة تعريف localProperties وحل مشكلتها في ملف build.gradle وإعداد الـ SDK
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "localProperties = new Properties()" android/app/build.gradle; then
              sed -i '1i def localProperties = new Properties()\ndef localPropertiesFile = rootProject.file("local.properties")\nif (localPropertiesFile.exists()) {\n    localProperties.load(new FileInputStream(localPropertiesFile))\n}\n' android/app/build.gradle
            fi
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle || true
          fi
          
          cd -
          cp -a ../app_build/android ./

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
