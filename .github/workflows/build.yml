name: Build APK Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Setup Android Platform & Fix SDK
        run: |
          # إصلاح اسم الحزمة في pubspec.yaml مؤقتاً لتجنب خطأ الحروف الكبيرة
          sed -i 's/^name:.*/name: store_app/g' pubspec.yaml
          
          # توليد منصة أندرويد بشكل نظيف
          flutter create . --platforms=android --org com.store.app
          
          # تعديل الحد الأدنى للـ SDK إلى 21
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle || true
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
