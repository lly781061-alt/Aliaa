    sdk: flutter

  flutter_localizations:
    sdk: flutter

  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
